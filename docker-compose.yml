services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpass}
      POSTGRES_DB: ${POSTGRES_DB:-jobscraper}
    ports:
      # Host-only: the api container reaches Postgres via the Docker network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobuser} -d $${POSTGRES_DB:-jobscraper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job-scraper-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host-only: the api container reaches Redis via the Docker network
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: job-scraper-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobuser}:${POSTGRES_PASSWORD:-jobpass}@postgres:5432/${POSTGRES_DB:-jobscraper}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS must be set}
      # Must match the exact origin used in the browser (CORS)
      FRONTEND_URL: http://${HOST_IP:-localhost}:3000
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time: rebuild after changing HOST_IP
        NEXT_PUBLIC_API_URL: http://${HOST_IP:-localhost}:3001/api/v1
    container_name: job-scraper-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_TRUST_HOST: "true"
      # Auth.js v5 reads AUTH_URL; NextAuth v4 reads NEXTAUTH_URL
      AUTH_URL: http://${HOST_IP:-localhost}:3000
      NEXTAUTH_URL: http://${HOST_IP:-localhost}:3000
      NEXT_PUBLIC_API_URL: http://${HOST_IP:-localhost}:3001/api/v1
      # Container-to-container traffic: always the service name, never HOST_IP
      INTERNAL_API_URL: http://api:3001/api/v1
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: